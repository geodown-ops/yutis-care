# Included in every location that sets its own headers (nginx drops inherited add_header lines when a location adds one).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Sign-in (Firebase Auth SDK against Identity Platform) loads Google's script, opens the auth domain's iframe and calls
# the token APIs; the reCAPTCHA sources are only used if reCAPTCHA Enterprise is turned on for the project.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://*.firebaseapp.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
