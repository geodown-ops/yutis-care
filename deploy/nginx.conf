# Behind the Google Cloud load balancer, which terminates TLS and routes /api and /platform-api to the APIs.
# /srv/web holds the tenant back office with the employee portal under /srv/web/me; /srv/platform the platform back office.
map $http_host $site_root {
  ~^admin\.  /srv/platform;
  default    /srv/web;
}

server {
  listen 8080;
  server_tokens off;
  root $site_root;

  location = /healthz { access_log off; return 204; }

  # Hashed build output never changes under the same name.
  location ~ ^/(me/)?assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Employee portal (single-page app, base /me/). Not offered on the platform host.
  location /me/ {
    if ($site_root = /srv/platform) { return 404; }
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control no-cache always;
    try_files $uri /me/index.html;
  }
  location = /me { return 301 /me/; }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control no-cache always;
    try_files $uri /index.html;
  }
}
