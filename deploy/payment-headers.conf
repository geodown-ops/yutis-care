# The payment page (/pay/ on the marketing site) only: security-headers.conf, plus TapPay's Direct Pay SDK, its card
# fields (iframes) and the calls that turn the card into a prime. Every other page keeps the stricter policy.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.tappaysdk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tappaysdk.com; connect-src 'self' https://*.tappaysdk.com; frame-src https://*.tappaysdk.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
