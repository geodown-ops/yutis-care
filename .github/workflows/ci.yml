name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Migrations match the schema
        run: |
          pnpm --filter @yutis/db db:generate
          test -z "$(git status --porcelain packages/db/migrations)" || { git status --porcelain packages/db/migrations; echo 'Run pnpm --filter @yutis/db db:generate and commit the migration.'; exit 1; }
      - run: pnpm test
      - run: pnpm build
      - name: OpenAPI contract is up to date
        run: |
          pnpm --filter @yutis/api openapi
          git diff --exit-code apps/api/openapi.json || { echo 'Run pnpm build && pnpm --filter @yutis/api openapi and commit apps/api/openapi.json.'; exit 1; }
